[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roostoo-hackathon-bot"
version = "0.1.0"
description = "Autonomous Roostoo bot with paper execution and durable order journal"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["matplotlib>=3.8"]

[project.scripts]
trading-bot = "trading_bot.main:main"
backtest-bot = "trading_bot.backtesting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
